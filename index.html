<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>DG Nexus AI (Hybrid Edition)</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">DG</span>
          <div>
            <h1>DG Nexus AI</h1>
            <p>Hybrid Edition · by DG Alpha Systems</p>
          </div>
        </div>
        <div class="chips" id="chips"></div>
      </header>

      <div id="banner"></div>

      <main class="grid">
        <section class="panel wallet" id="wallet"></section>
        <section class="panel metrics" id="metrics"></section>

        <section class="panel terminal">
          <div class="panel-head">
            <h2>Payments &amp; Analysis Terminal</h2>
            <div class="actions">
              <button id="btn-enable" class="btn primary">Enable on-device AI</button>
              <button id="btn-seed" class="btn">Load demo data</button>
            </div>
          </div>
          <div id="nano-progress" class="progress hidden"><div></div></div>
          <div id="term-out" class="term-out" aria-live="polite"></div>
          <div class="quick" id="quick"></div>
          <form id="term-form" class="term-form" autocomplete="off">
            <span class="prompt">&gt;</span>
            <input id="term-in" type="text" placeholder="/add Paid $23.40 at Casa Luna for lunch   ·   /help" />
            <button class="btn primary" type="submit">Run</button>
          </form>
        </section>

        <aside class="panel routing" id="routing"></aside>
        <section class="panel txs" id="txs"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
